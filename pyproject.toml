[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pypaz"
dynamic = ["version"]
description = "Perception for Autonomous Systems"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Octavio Arriaga" }
]
keywords = [
    "computer vision",
    "perception",
    "robotics",
    "deep learning",
    "differentiable rendering",
    "jax",
    "keras",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Recognition",
]
dependencies = [
    "numpy>=1.26",
    "opencv-python>=4.8",
    "keras>=3",
    "jax",
    "matplotlib",
    "optax",
    "pyyaml>=6",
    "scipy",
    "trimesh"
]

[project.optional-dependencies]
sonic = [
    "mujoco>=3.3",
    "onnx>=1.16",
]
gear_wbc = [
    "mujoco>=3.3",
    "onnx>=1.16",
    "pygame>=2.6",
]
learning_to_walk = [
    "mujoco>=3.3",
    "pygame>=2.6",
    "pyyaml>=6",
    "torch>=2.0",
]
weights = [
    "safetensors",
    "huggingface_hub",
    "keras_hub",
]
datasets = [
    "gdown",
    "kaggle",
    "cityscapesscripts",
]

[project.urls]
Homepage = "https://github.com/oarriaga/paz"
Repository = "https://github.com/oarriaga/paz"
Issues = "https://github.com/oarriaga/paz/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["paz*"]

[tool.setuptools.dynamic]
version = { attr = "paz.__version__" }

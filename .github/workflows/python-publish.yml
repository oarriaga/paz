# Publishes to PyPI with trusted publishing (OIDC), no stored credentials.
# The PyPI project `pypaz` must have this repository (oarriaga/paz), the
# workflow file `python-publish.yml` and the environment `pypi` registered
# as a trusted publisher: https://docs.pypi.org/trusted-publishers/

name: PyPI package

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: pypi
    permissions:
      contents: read
      id-token: write

    steps:
    - uses: actions/checkout@v7
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.11"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build
    - name: Build package
      run: python -m build
    - name: Publish package
      uses: pypa/gh-action-pypi-publish@release/v1

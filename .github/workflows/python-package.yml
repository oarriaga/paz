name: Unit testing

on:
  push:
    branches: [paz-jax, master]
  pull_request:
    branches: [paz-jax, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    # No weights, dataset or reference opt-in variables are set here, so the
    # tests gated on them (PAZ_SAM2_DOWNLOAD, GEMMA4_WEIGHTS_TEST, ...) skip.
    env:
      KERAS_BACKEND: jax
      JAX_PLATFORMS: cpu

    steps:
    - uses: actions/checkout@v7
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
        cache: pip
        cache-dependency-path: pyproject.toml
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # The jax wheel from PyPI is CPU-only.
        pip install jax
        pip install -e .
        pip install pytest pyflakes
        # `import paz` needs both until pyproject.toml declares pyyaml and
        # the library stops using cv2.SOLVEPNP_UPNP, which OpenCV 5 removed.
        pip install pyyaml "opencv-python<5"
    - name: Lint with pyflakes
      # Non-blocking until the existing findings in paz/ are cleaned up.
      continue-on-error: true
      run: python -m pyflakes paz
    - name: Test with pytest
      run: pytest paz/ tests/ -q
